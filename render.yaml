# Render Blueprint: Python API (FastAPI, Docker) + managed PostgreSQL.
# The Next.js frontend is deployed separately (Netlify) and proxies /api/* here.
databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus

services:
  - type: web
    name: nexus-os-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
